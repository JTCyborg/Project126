name: Project126 ATM, NeoGS and TR-DOS image build

on:
  push:
    branches: [main]
    paths:
      - "neogs_sub/**"
      - "shared/**"
      - "atm_host/**"
      - "tools/build_project126.ps1"
      - "tools/sjasmplus.exe"
      - "build_project126.bat"
      - ".github/workflows/neogs-assembly.yml"
  pull_request:
    paths:
      - "neogs_sub/**"
      - "shared/**"
      - "atm_host/**"
      - "tools/build_project126.ps1"
      - "tools/sjasmplus.exe"
      - "build_project126.bat"
      - ".github/workflows/neogs-assembly.yml"
  workflow_dispatch:

jobs:
  assemble-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble ATM, NeoGS and create TR-DOS disk
        shell: pwsh
        run: .\tools\build_project126.ps1

      - name: Publish binaries, listings, maps and TR-DOS disk
        uses: actions/upload-artifact@v4
        with:
          name: project126-trdos-disk-and-build
          if-no-files-found: error
          path: |
            disk_A.trd
            build/disk_A.trd
            build/x86_cpu_state.bin
            build/X86CORE.C
            build/X86IO.C
            build/X86ALU.C
            build/X86DEV.C
            build/X86EXEC.C
            build/X86MODS.MF
            build/NEOGS.lst
            build/NEOGS.map
            build/ATM_IPC.bin
            build/ATM.lst
            build/ATM.map
            build/P126_NGS_IPC.bin
            build/NEOGS_IPC.lst
            build/NEOGS_IPC.map
            build/ATM_DISK.lst
            build/ATM_DISK.map
